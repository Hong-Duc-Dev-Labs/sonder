name: ci

on:
  push:
  pull_request:

jobs:
  forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-forbidden-files.sh

  test:
    needs: forbidden-files
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA and WebKitGTK headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # The app crate embeds the built UI, so it must exist before cargo compiles it.
      - name: Check and build the UI
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test
          pnpm build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No audio hardware on the runners: device backends are compile-checked here and the
      # engine is exercised end to end through the null backend.
      - run: cargo test --workspace
