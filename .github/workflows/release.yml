name: release

# Pushing a tag such as v0.2.0 builds signed installers for every OS and attaches them, their
# .sig files and the updater's latest.json to a draft release. Publishing the draft is what
# makes running copies of Sonder offer the update.
on:
  push:
    tags: ["v*"]

jobs:
  forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-forbidden-files.sh

  build:
    needs: forbidden-files
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA and WebKitGTK headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The minisign key the app's updater public key belongs to.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Sonder ${{ github.ref_name }}
          releaseBody: See the commits since the previous release.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
