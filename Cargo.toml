[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
sonder-decode = { path = "crates/sonder-decode" }
sonder-output = { path = "crates/sonder-output" }
sonder-engine = { path = "crates/sonder-engine" }
sonder-library = { path = "crates/sonder-library" }
sonder-lyrics = { path = "crates/sonder-lyrics" }
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
rtrb = "0.4.1"
crossbeam-channel = "0.5.17"
sha2 = "0.11.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
rayon = "1.12.0"
notify-debouncer-mini = "0.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tempfile = "3.27.0"
hound = "3.5.1"
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "alac", "wav", "aiff", "isomp4", "pcm"] }
symphonia-common = "0.6.1"
wasapi = "0.27.0"
windows = "0.62.2"
alsa = "0.12.1"
libc = "0.2"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
