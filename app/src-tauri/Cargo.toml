[package]
name = "sonder-app"
description = "Sonder desktop app: Tauri shell over the engine and library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sonder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
sonder-decode.workspace = true
sonder-engine.workspace = true
sonder-dsp.workspace = true
sonder-library.workspace = true
sonder-lyrics.workspace = true
sonder-metadata.workspace = true
sonder-autoeq.workspace = true
sonder-quality = { workspace = true, features = ["specta"] }
sonder-output.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22.1"
toml = "1.2.1"
directories = "6.0.0"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
