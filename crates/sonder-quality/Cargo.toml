[package]
name = "sonder-quality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sonder-decode.workspace = true
sonder-dsp.workspace = true
realfft.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
thiserror.workspace = true
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }

[dev-dependencies]
sonder-verify.workspace = true
hound.workspace = true
md-5 = "0.11.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile.workspace = true

[features]
# Derives `specta::Type` on the report types, for the app's generated TypeScript bindings.
specta = ["dep:specta"]
